<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة امتحانات الطلاب - M&H</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="icon.png" />
    <!-- مكتبات Firebase الأساسية -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary-color: #6366f1;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 700px;
            border-top: 6px solid var(--primary-color);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #475569;
        }

        .ui-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .ui-input:focus {
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-color), #4f46e5);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        /* تصميم الأسئلة */
        .question-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .question-title {
            font-weight: 900;
            font-size: 18px;
            margin-bottom: 15px;
            color: #0f172a;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px;
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }

        .option-label:hover {
            border-color: var(--primary-color);
            background: #e0e7ff;
        }

        input[type="radio"] {
            margin-left: 10px;
            transform: scale(1.2);
        }

        .result-box {
            text-align: center;
            padding: 30px;
            border-radius: 15px;
            margin-top: 20px;
            display: none;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ef4444;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
            z-index: 1000;
        }

        /* ⏰ التعديل الجديد: عداد طاير مع تأثير نبض */
        .timer-display {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(254, 226, 226, 0.95);
            color: #ef4444;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 16px;
            text-align: center;
            border: 2px solid #fca5a5;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3);
            z-index: 99999;
            display: none;
            direction: rtl;
            backdrop-filter: blur(5px);
            animation: pulseTimer 2s infinite;
        }

        /* أنيميشن النبض للعداد */
        @keyframes pulseTimer {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        /* ضبط مكان العداد في شاشات الموبايل عشان ميغطيش على حاجة */
        @media (max-width: 768px) {
            .timer-display {
                top: auto;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                font-size: 14px;
                padding: 10px 20px;
                width: max-content;
            }
        }
    </style>
</head>

<body>

    <div class="container" id="loginSection">
        <div class="header">
            <h1 style="color: var(--primary-color); margin-bottom: 5px;"><i class='bx bx-laptop'></i> بوابة الامتحانات
            </h1>
            <p style="color: #64748b; margin-top: 0;">الرجاء إدخال بياناتك وكود الامتحان للبدء</p>
        </div>

        <div class="input-group">
            <label>كود الامتحان (يعطيه لك المعلم)</label>
            <input type="text" id="examCodeInput" class="ui-input" placeholder="مثال: IN2A5"
                style="text-transform: uppercase; font-weight: bold; letter-spacing: 2px; text-align: center;">
        </div>

        <div class="input-group">
            <label>كود الطالب أو الاسم الثلاثي</label>
            <input type="text" id="studentIdentifierInput" class="ui-input"
                placeholder="مثال: ST_2065 أو إياد مسعد فاروق">
        </div>

        <button class="btn" onclick="startExam()">بدء الامتحان 🚀</button>
    </div>

    <div class="container" id="examSection" style="display: none;">
        <div class="header" style="border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px;">
            <h2 id="displayExamTitle" style="color: var(--primary-color); margin: 0;">جاري التحميل...</h2>
            <p id="displayStudentName" style="color: #64748b; margin-top: 5px; font-weight: bold;"></p>
        </div>

        <!-- ⏰ العداد الطاير تم تجهيزه هنا -->
        <div id="timerDisplay" class="timer-display"></div>

        <div id="questionsContainer">
            <!-- سيتم حقن الأسئلة هنا برمجياً -->
        </div>

        <button class="btn" onclick="submitExam()"
            style="background: linear-gradient(135deg, #10b981, #059669); margin-top: 20px;">تسليم الإجابات ✅</button>
    </div>

    <div class="container result-box" id="resultSection">
        <i class='bx bx-check-circle' style="font-size: 80px; color: #10b981;"></i>
        <h2 style="color: #0f172a;">تم تسليم الامتحان بنجاح!</h2>
        <div id="scoreDisplay" style="display: none; margin-top: 20px;">
            <p style="font-size: 18px; font-weight: bold; color: #475569;">نتيجتك هي:</p>
            <div style="font-size: 45px; font-weight: 900; color: var(--primary-color); direction: ltr; display: inline-block;"
                id="finalScoreText">0 / 0</div>
            <p id="feedbackText" style="font-weight: bold; margin-top: 10px;"></p>
        </div>
        <div id="hiddenResultMsg"
            style="display: none; margin-top: 20px; color: #b45309; background: #fef3c7; padding: 15px; border-radius: 10px; font-weight: bold;">
            النتيجة مخفية حالياً. سيقوم معلمك بإبلاغك بدرجتك لاحقاً.
        </div>
    </div>

    <div class="toast" id="toastMsg"></div>
    <script>
        // إعدادات Firebase الخاصة بك

        const firebaseConfig = {
            apiKey: "AIzaSyDAbNo9AHi73rTNogXHpKk9MDp8HpY16Mw",
            authDomain: "elalfey-app.firebaseapp.com",
            projectId: "elalfey-app",
            storageBucket: "elalfey-app.firebasestorage.app",
            messagingSenderId: "676659616653",
            appId: "1:676659616653:web:6a6e3ef338cc9a0e8bfbc4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentExamData = null;
        let studentIdentifier = "";
        let timerInterval = null;

        function showToast(msg) {
            const t = document.getElementById('toastMsg');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 4000);
        }

        // 💡 إضافة المنظف اللغوي لصفحة الطالب
        function normalizeArabicName(text) {
            if (!text) return "";
            return String(text)
                .replace(/[أإآا]/g, 'ا')
                .replace(/[يى]/g, 'ي')
                .replace(/[ةه]/g, 'ه')
                .replace(/\s+/g, ' ')
                .trim()
                .toLowerCase();
        }

        async function startExam() {
            const code = document.getElementById('examCodeInput').value.trim().toUpperCase();
            const rawId = document.getElementById('studentIdentifierInput').value.trim();

            studentIdentifier = rawId.replace(/[\/\\]/g, '_');

            if (!code || !studentIdentifier) return showToast('يرجى إدخال الكود وبياناتك بالكامل');

            try {
                const docSnap = await db.collection('online_exams').doc(code).get();
                if (!docSnap.exists) return showToast('❌ كود الامتحان غير صحيح أو الامتحان غير متاح!');

                currentExamData = docSnap.data();

                // 💡 التعديل الجديد (البواب الإلكتروني): لو الامتحان مش للكل، هنفتش في قائمة المدعوين
                if (currentExamData.classId !== 'all') {
                    let allowed = currentExamData.allowedStudents || [];
                    let normalizedInput = normalizeArabicName(studentIdentifier);
                    let rawLowerInput = String(studentIdentifier).trim().toLowerCase();

                    // لو اسمه أو كوده مش في القائمة، نطرده فوراً
                    if (!allowed.includes(normalizedInput) && !allowed.includes(rawLowerInput)) {
                        return showToast('⛔ عذراً، أنت لست مسجلاً في هذا الفصل. راجع المعلم للتأكد من الكود أو الاسم!');
                    }
                }

                if (currentExamData.endTime && Date.now() > currentExamData.endTime) {
                    return showToast('⏳ لقد انتهى الموعد المحدد لهذا الامتحان وتم إغلاقه!');
                }

                if (!currentExamData.active) return showToast('⚠️ هذا الامتحان مغلق حالياً من قبل المعلم.');

                const resultSnap = await db.collection('online_exams').doc(code).collection('results').doc(studentIdentifier).get();
                if (resultSnap.exists) {
                    return showToast('✋ لقد قمت بأداء وتسليم هذا الامتحان مسبقاً، لا يمكنك الدخول مرة أخرى!');
                }

                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('examSection').style.display = 'block';
                document.getElementById('displayExamTitle').innerText = currentExamData.title;
                document.getElementById('displayStudentName').innerText = "الطالب: " + studentIdentifier;

                renderQuestions();

                if (currentExamData.endTime) {
                    startTimer(currentExamData.endTime);
                }

            } catch (error) {
                showToast('حدث خطأ في الاتصال بالسيرفر: ' + error.message);
            }
        }

        // ⏰ دالة العداد التنازلي وسحب الورقة آلياً
        function startTimer(endTimeMillis) {
            let timerDisplay = document.getElementById('timerDisplay');
            timerDisplay.style.display = 'block'; // إظهار العداد الطاير

            timerInterval = setInterval(() => {
                const diff = endTimeMillis - Date.now();

                if (diff <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.innerHTML = "انتهى الوقت! ⏳";
                    alert("انتهى وقت الامتحان! سيتم تسليم إجاباتك الحالية آلياً.");
                    submitExam(true); // الـ true معناه إنه تسليم إجباري بدون سؤال
                } else {
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                    // عرض الوقت بشكل منسق مع إضافة صفر للثواني أقل من 10
                    timerDisplay.innerHTML = `⏳ متبقي: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                }
            }, 1000);
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            let html = '';
            const realQuestions = currentExamData.questions.filter(q => q.type !== 'heading');

            realQuestions.forEach((q, index) => {
                html += `<div class="question-card">`;
                html += `<div class="question-title">${index + 1}. ${q.text.replace(/\\n/g, '<br>')}</div>`;

                if (q.type === 'mcq' && q.options) {
                    q.options.forEach(opt => {
                        html += `<label class="option-label"><input type="radio" name="q_${index}" value="${opt.l}"> (${opt.l}) ${opt.t}</label>`;
                    });
                } else if (q.type === 'tf_inline') {
                    html += `<label class="option-label"><input type="radio" name="q_${index}" value="ص"> صح</label>
                             <label class="option-label"><input type="radio" name="q_${index}" value="خ"> خطأ</label>`;
                } else if (q.type === 'essay') {
                    html += `<textarea name="q_${index}" class="ui-input" rows="3" placeholder="اكتب إجابتك هنا..."></textarea>`;
                }
                html += `</div>`;
            });
            container.innerHTML = html;
        }

        // 💡 التعديل هنا: الدالة اتبرمجت عشان تظهر "جاري التحميل" ومتطلعش النتيجة الخضراء إلا لو السيرفر وافق!
        async function submitExam(isAuto = false) {
            if (!isAuto && !confirm('هل أنت متأكد من تسليم الإجابات؟ لن تتمكن من التعديل بعد التسليم.')) return;

            if (timerInterval) {
                clearInterval(timerInterval); // إيقاف العداد
                document.getElementById('timerDisplay').style.display = 'none'; // إخفاء العداد بعد التسليم
            }

            const realQuestions = currentExamData.questions.filter(q => q.type !== 'heading');
            let correctCount = 0;
            let totalAutoGraded = 0;
            let studentAnswers = {};

            realQuestions.forEach((q, index) => {
                if (q.type === 'mcq' || q.type === 'tf_inline') {
                    totalAutoGraded++;
                    const selectedOption = document.querySelector(`input[name="q_${index}"]:checked`);
                    let userAnswer = selectedOption ? selectedOption.value : "بدون إجابة";
                    studentAnswers[`q_${index}`] = userAnswer;
                    if (userAnswer === q.ans) correctCount++;
                } else {
                    const textArea = document.querySelector(`textarea[name="q_${index}"]`);
                    studentAnswers[`q_${index}`] = textArea ? textArea.value : "";
                }
            });

            // إخفاء الامتحان وإظهار شاشة (جاري التحميل) للطالب
            document.getElementById('examSection').style.display = 'none';
            const resultSec = document.getElementById('resultSection');
            resultSec.style.display = 'block';
            resultSec.innerHTML = `<i class='bx bx-loader-alt bx-spin' style="font-size: 80px; color: var(--primary-color);"></i><h2 style="color: #0f172a;">جاري إرسال وتصحيح الإجابات... ⏳</h2>`;

            try {
                // ننتظر رد السيرفر وتأكيد الحفظ
                await saveResultToCloud(correctCount, totalAutoGraded, studentAnswers);

                // لو السيرفر وافق، نرسم الشاشة الخضراء والنتيجة
                let scoreHtml = '';
                if (currentExamData.showResults) {
                    let percentage = (correctCount / totalAutoGraded) * 100;
                    let feedbackColor = percentage >= 85 ? "#10b981" : percentage >= 50 ? "#3b82f6" : "#ef4444";
                    let feedbackText = percentage >= 85 ? "أداء ممتاز! 🌟" : percentage >= 50 ? "لقد اجتزت الاختبار 👍" : "تحتاج إلى مزيد من المذاكرة 📚";

                    scoreHtml = `
                        <div style="margin-top: 20px;">
                            <p style="font-size: 18px; font-weight: bold; color: #475569;">نتيجتك هي:</p>
                            <div style="font-size: 45px; font-weight: 900; color: var(--primary-color); direction: ltr; display: inline-block;">${correctCount} / ${totalAutoGraded}</div>
                            <p style="font-weight: bold; margin-top: 10px; color: ${feedbackColor};">${feedbackText}</p>
                        </div>`;
                } else {
                    scoreHtml = `
                        <div style="margin-top: 20px; color: #b45309; background: #fef3c7; padding: 15px; border-radius: 10px; font-weight: bold;">
                            النتيجة مخفية حالياً. سيقوم معلمك بإبلاغك بدرجتك لاحقاً.
                        </div>`;
                }

                resultSec.innerHTML = `
                    <i class='bx bx-check-circle' style="font-size: 80px; color: #10b981;"></i>
                    <h2 style="color: #0f172a;">تم تسليم الامتحان بنجاح!</h2>
                    ${scoreHtml}
                `;
            } catch (error) {
                // لو السيرفر رفض الحفظ (لأي سبب، زي إن الطالب امتحن قبل كده)
                resultSec.innerHTML = `
                    <i class='bx bx-error-circle' style="font-size: 80px; color: #ef4444;"></i>
                    <h2 style="color: #ef4444;">فشل إرسال النتيجة!</h2>
                    <p style="font-weight: bold; color: #475569;">${error.message}</p>
                    <button class="btn" onclick="submitExam(true)" style="background: #ef4444; margin-top: 15px;">حاول الإرسال مرة أخرى 🔄</button>
                `;
            }
        }

        async function saveResultToCloud(correctCount, totalAutoGraded, studentAnswers) {
            const code = document.getElementById('examCodeInput').value.trim().toUpperCase();

            // تم إزالة try/catch من هنا لكي ينتقل الخطأ (إن وجد) للدالة السابقة وتعرض رسالة الخطأ للطالب
            await db.collection('online_exams').doc(code).collection('results').doc(studentIdentifier).set({
                studentIdentifier: studentIdentifier,
                score: correctCount,
                total: totalAutoGraded,
                answers: studentAnswers,
                submittedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
    </script>
</body>

</html>
